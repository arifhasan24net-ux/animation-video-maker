<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>অ্যানিমেশন ভিডিও মেকার Pro</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eaf0f4;--card:#fff;--tx:#14232b;--mut:#5d6f7a;--ac:#0c8599;--bd:#d3dee5;--in:#f6f9fb}
@media(prefers-color-scheme:dark){:root{--bg:#10191e;--card:#192329;--tx:#eef4f7;--mut:#93a6b0;--bd:#2b3a42;--in:#121b20}}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0 auto;max-width:780px;padding:14px;background:var(--bg);color:var(--tx);font-family:'Hind Siliguri','Noto Sans Bengali',sans-serif;line-height:1.5}
h1{font-size:22px;margin:6px 0 12px;display:flex;align-items:center;justify-content:space-between}
.badge{font-size:12px;background:var(--ac);color:#fff;padding:2px 8px;border-radius:20px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,.04)}
label{display:block;font-weight:700;margin:10px 0 4px;font-size:15px}
label:first-child{margin-top:0}
input[type=file],select,textarea{width:100%;padding:9px;border:1px solid var(--bd);border-radius:8px;background:var(--in);color:var(--tx);font:inherit}
textarea{height:96px;font-size:13px;resize:vertical}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
button,.btn{flex:1;min-width:140px;padding:11px 14px;border:0;border-radius:9px;background:var(--ac);color:#fff;font:700 15px inherit;font-family:inherit;cursor:pointer;text-align:center;text-decoration:none;display:inline-block;transition:transform .1s}
button:active,.btn:active{transform:scale(.98)}
button.alt{background:transparent;color:var(--ac);border:1.5px solid var(--ac)}
button:disabled{opacity:.5;cursor:not-allowed}
.hint{color:var(--mut);font-size:13px;margin:4px 0 0}
.box-sub{background:var(--in);border:1px dashed var(--bd);border-radius:10px;padding:10px;margin-top:8px}
#st{margin:10px 0 6px;font-weight:700;min-height:24px}
.bar{height:10px;background:var(--bd);border-radius:6px;overflow:hidden}
#bar{height:100%;width:0;background:linear-gradient(90deg,#ff6b6b,#fcc419,#51cf66,#339af0,#cc5de8)}
.stage{position:relative;width:fit-content;max-width:100%;margin:12px auto 0}
canvas{display:block;max-width:100%;max-height:62vh;background:#000;border-radius:8px;box-shadow:0 4px 16px rgba(0,0,0,.15)}
video{display:block;margin:10px auto;max-width:100%;max-height:70vh;background:#000;border-radius:8px}
#res{border:2px solid var(--ac)}
#ov{position:absolute;inset:0;border-radius:8px;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:#fff;text-align:center;background:linear-gradient(135deg,#ff6b6b,#fcc419,#51cf66,#339af0,#cc5de8,#ff6b6b);background-size:400% 400%;animation:bgm 7s ease infinite}
#ov .big{font-size:clamp(40px,12vw,64px);font-weight:700;text-shadow:0 3px 10px rgba(0,0,0,.3)}
#ov .msg{font-size:clamp(16px,4.5vw,22px);font-weight:700;text-shadow:0 2px 6px rgba(0,0,0,.3);padding:0 14px}
#ov .dots span{display:inline-block;width:16px;height:16px;margin:0 5px;border-radius:50%;background:#fff;animation:bn .9s ease-in-out infinite}
#ov .dots span:nth-child(2){animation-delay:.15s}#ov .dots span:nth-child(3){animation-delay:.3s}#ov .dots span:nth-child(4){animation-delay:.45s}#ov .dots span:nth-child(5){animation-delay:.6s}
.spin{width:54px;height:54px;border:6px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:sp 1s linear infinite}
@keyframes bgm{0%,100%{background-position:0 50%}50%{background-position:100% 50%}}
@keyframes bn{0%,100%{transform:translateY(0)}50%{transform:translateY(-22px)}}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<h1>অ্যানিমেশন ভিডিও মেকার <span class="badge">NETLIFY PRO</span></h1>

<div class="card">
  <label>১. ভয়েস-ওভার অডিও (একটি ফাইল অথবা একাধিক ফাইল জুড়ে নিন)</label>
  <input type="file" id="aud" accept="audio/*">

  <div class="box-sub">
    <label style="margin-top:0">একাধিক অডিও ফাইল একসাথে জোড়া লাগান (ঐচ্ছিক)</label>
    <input type="file" id="audMulti" accept="audio/*" multiple>
    <div id="mList" class="hint">কোনো একাধিক ফাইল সিলেক্ট করা হয়নি</div>
    <div class="row" style="margin-top:8px">
      <button type="button" class="alt" id="mergeBtn">অডিওগুলো জুড়ে একসাথে সেট করুন</button>
      <a class="btn alt" id="mDl" href="#" hidden>জোড়া অডিও ডাউনলোড</a>
    </div>
  </div>

  <label>২. SRT সাবটাইটেল</label>
  <input type="file" id="srtF" accept=".srt,.txt">
  <textarea id="srt" placeholder="অথবা এখানে SRT পেস্ট করুন"></textarea>
  <div class="row"><button type="button" class="alt" id="cp">SRT থেকে AI প্রম্পট কপি করুন</button></div>
  <p class="hint">প্রম্পটটি AI-কে দিন, যে JSON ফেরত আসবে সেটা নিচে বসান।</p>

  <label>৩. দৃশ্য JSON</label>
  <input type="file" id="jsF" accept=".json,.txt">
  <textarea id="js" placeholder='{"characters":[...],"scenes":[...]}'></textarea>

  <label>ভিডিওর মাপ</label>
  <select id="fmt"><option value="9:16">9:16 (শর্টস / রিলস)</option><option value="16:9">16:9 (ইউটিউব)</option></select>

  <label>ভিডিওর মান</label>
  <select id="qa"><option value="1">720p (দ্রুত, ফোনের জন্য ভালো)</option><option value="1.5">1080p (HD, ফাইল বড় হবে)</option></select>

  <div class="row">
    <button type="button" id="go">ভিডিও তৈরি করুন</button>
    <button type="button" class="alt" id="pv">শুধু প্রিভিউ</button>
  </div>
</div>

<div class="card">
  <div id="st">প্রস্তুত</div>
  <div class="bar"><div id="bar"></div></div>
  <div class="stage">
    <canvas id="cv" width="720" height="1280"></canvas>
    <div id="ov" hidden>
      <div class="spin"></div>
      <div class="big" id="ovp">0%</div>
      <div class="dots"><span></span><span></span><span></span><span></span><span></span></div>
      <div class="msg">আপনার অ্যানিমেশন ভিডিও তৈরি হচ্ছে…<br>একটু অপেক্ষা করুন</div>
    </div>
  </div>
  <p class="hint">তৈরির সময় এই ট্যাব খোলা ও স্ক্রিনে রাখুন।</p>
</div>

<div class="card" id="res" hidden>
  <strong>✅ ভিডিও তৈরি শেষ</strong>
  <video id="vid" controls playsinline></video>
  <div id="info" class="hint" style="text-align:center"></div>
  <div class="row">
    <button type="button" id="sh">শেয়ার করুন</button>
    <a class="btn" id="dl" href="#">ডাউনলোড করুন</a>
  </div>
</div>

<script>
const $=id=>document.getElementById(id);
const cv=$('cv'),cx=cv.getContext('2d');
const FONT='"Hind Siliguri","Noto Sans Bengali",sans-serif';
const DEF={id:'A',name:'চরিত্র',g:'m',shirt:'#1976D2',pants:'#37474F',hair:'#212121',skin:'#D9A47A'};
let W=720,H=1280,data={characters:[DEF],scenes:[]},subs=[],busy=false,lastUrl=null,lastBlob=null,DUR=0,mergedFile=null,mergedUrl=null;

function st(m,err){const e=$('st');e.textContent=m;e.style.color=err?'#d6336c':'';}
function setBusy(b){busy=b;['go','pv','cp','mergeBtn'].forEach(i=>$(i).disabled=b);}
window.addEventListener('error',e=>st('ত্রুটি: '+e.message,1));
window.addEventListener('unhandledrejection',e=>st('ত্রুটি: '+(e.reason&&e.reason.message||e.reason),1));

function readText(f){return new Promise((r,j)=>{const x=new FileReader();x.onload=()=>r(x.result);x.onerror=j;x.readAsText(f,'utf-8');});}
$('srtF').onchange=async e=>{if(e.target.files[0])$('srt').value=await readText(e.target.files[0]);};
$('jsF').onchange=async e=>{if(e.target.files[0])$('js').value=await readText(e.target.files[0]);};

function sortedFiles(fileList){
  return Array.from(fileList||[]).sort((a,b)=>a.name.localeCompare(b.name,undefined,{numeric:true,sensitivity:'base'}));
}
$('audMulti').onchange=e=>{
  const fs=sortedFiles(e.target.files);
  if(!fs.length){$('mList').textContent='কোনো একাধিক ফাইল সিলেক্ট করা হয়নি';return;}
  $('mList').textContent='ক্রম অনুযায়ী ফাইল ('+fs.length+'টি): '+fs.map(f=>f.name).join(' → ');
};
function audioBufferToWav(buffer){
  const numCh=buffer.numberOfChannels,sr=buffer.sampleRate,len=buffer.length;
  const blockAlign=numCh*2,dataSize=len*blockAlign,ab=new ArrayBuffer(44+dataSize),view=new DataView(ab);
  const ws=(o,s)=>{for(let i=0;i<s.length;i++)view.setUint8(o+i,s.charCodeAt(i));};
  ws(0,'RIFF');view.setUint32(4,36+dataSize,true);ws(8,'WAVE');ws(12,'fmt ');
  view.setUint32(16,16,true);view.setUint16(20,1,true);view.setUint16(22,numCh,true);
  view.setUint32(24,sr,true);view.setUint32(28,sr*blockAlign,true);view.setUint16(32,blockAlign,true);
  view.setUint16(34,16,true);ws(36,'data');view.setUint32(40,dataSize,true);
  let off=44;
  for(let i=0;i<len;i++){
    for(let ch=0;ch<numCh;ch++){
      let s=Math.max(-1,Math.min(1,buffer.getChannelData(ch)[i]));
      view.setInt16(off,s<0?s*0x8000:s*0x7FFF,true);
      off+=2;
    }
  }
  return new Blob([ab],{type:'audio/wav'});
}
$('mergeBtn').onclick=async()=>{
  const fs=sortedFiles($('audMulti').files);
  if(fs.length<2)return st('জোড়া লাগাতে কমপক্ষে ২টি অডিও ফাইল সিলেক্ট করুন',1);
  let ac=null;
  try{
    setBusy(true);
    st('একাধিক অডিও জোড়া লাগানো হচ্ছে…');
    const AC=window.AudioContext||window.webkitAudioContext;
    ac=new AC();
    const decoded=[];
    for(const f of fs){
      decoded.push(await ac.decodeAudioData(await f.arrayBuffer()));
    }
    const sr=decoded[0].sampleRate;
    const numCh=Math.max(...decoded.map(b=>b.numberOfChannels));
    const totalLen=decoded.reduce((acc,b)=>acc+Math.round(b.duration*sr),0);
    const outBuf=ac.createBuffer(numCh,totalLen,sr);
    let cursor=0;
    for(const b of decoded){
      const frames=Math.round(b.duration*sr);
      for(let ch=0;ch<numCh;ch++){
        const srcData=b.getChannelData(Math.min(ch,b.numberOfChannels-1));
        const dstData=outBuf.getChannelData(ch);
        for(let i=0;i<frames&&i<srcData.length;i++){
          dstData[cursor+i]=srcData[i];
        }
      }
      cursor+=frames;
    }
    const wavBlob=audioBufferToWav(outBuf);
    mergedFile=new File([wavBlob],'merged-voiceover.wav',{type:'audio/wav'});
    if(mergedUrl)URL.revokeObjectURL(mergedUrl);
    mergedUrl=URL.createObjectURL(wavBlob);
    $('mDl').href=mergedUrl;
    $('mDl').download='merged-voiceover.wav';
    $('mDl').hidden=false;

    const dt=new DataTransfer();
    dt.items.add(mergedFile);
    $('aud').files=dt.files;
    st('✅ '+fs.length+'টি অডিও জোড়া লেগে "১. ভয়েস-ওভার অডিও"-তে সেট হয়েছে ('+outBuf.duration.toFixed(1)+'s)');
  }catch(e){
    st('অডিও জোড়া লাগাতে সমস্যা: '+e.message,1);
  }finally{
    if(ac)ac.close().catch(()=>{});
    setBusy(false);
  }
};

function parseSRT(s){
  s=s.replace(/^\uFEFF/,'').replace(/\r/g,'').trim();
  if(!s)return[];
  return s.split(/\n\s*\n/).map(b=>{
    const L=b.split('\n').filter(x=>x.trim());
    const k=L.findIndex(l=>l.includes('-->'));
    if(k<0)return null;
    const m=L[k].match(/(\d+):(\d+):(\d+)[,.](\d+)\s*-->\s*(\d+):(\d+):(\d+)[,.](\d+)/);
    if(!m)return null;
    const T=(h,mi,se,ms)=>+h*3600+ +mi*60+ +se+ +ms.padEnd(3,'0').slice(0,3)/1000;
    return{s:T(...m.slice(1,5)),e:T(...m.slice(5,9)),t:L.slice(k+1).join(' ').trim()};
  }).filter(Boolean);
}
function parseJ(s){
  s=s.replace(/```json|```/g,'');
  const a=s.indexOf('{'),b=s.lastIndexOf('}');
  if(a<0||b<0)throw Error('JSON পাওয়া যায়নি');
  const d=JSON.parse(s.slice(a,b+1));
  d.characters=(d.characters&&d.characters.length)?d.characters:[DEF];
  d.scenes=d.scenes||[];
  return d;
}

$('cp').onclick=async()=>{
  const sb=parseSRT($('srt').value);
  if(!sb.length)return st('আগে SRT দিন',1);
  const p=`তুমি একটি বাংলা ভিডিও স্ক্রিপ্ট বিশ্লেষণ করছ (প্রতি লাইন "ইনডেক্স|টেক্সট")। শুধু JSON ফেরত দাও, অন্য কিছু নয়।
ফরম্যাট: {"characters":[{"id":"A","name":"বাংলা নাম","g":"m|f|c","shirt":"#hex","pants":"#hex","hair":"#hex","skin":"#hex"}],"scenes":[{"i":0,"bg":"home|kitchen|market|street|office|park","chars":["A"],"pose":"sit|stand|walk|run|sleep|point|surprised|hug|pat|cry|wave|eat|laugh","talk":true,"speaker":"যে ক্যারেক্টার সংলাপ বলছে তার id, না বললে খালি","icon":"food|money|bag|phone|heart|clock|book|sun|house|question|none","hl":"লাইনের হুবহু একটি মূল শব্দ","label":"ছোট বাংলা ট্যাগ বা খালি","cam":"zoom|none"}]}
নিয়ম: মোট সর্বোচ্চ ৪ ক্যারেক্টার (id A,B,C,D), প্রতি দৃশ্যে সর্বোচ্চ ২ জন, প্রতিটি লাইনের জন্য একটি scene, গল্পের চরিত্রের লিঙ্গ/বয়স অনুযায়ী g (m পুরুষ, f নারী, c শিশু), প্রতিটি ক্যারেক্টারের রঙ আলাদা ও সুন্দর। আলিঙ্গন বা জড়িয়ে ধরা হলে pose hug (দুজন লাগবে), মাথায় হাত রাখলে pat, কান্না বা চোখে জল হলে cry, হাত নাড়লে wave, খাওয়া-দাওয়া হলে pose eat ও icon food (bg kitchen বা home), হাসি বা আনন্দ হলে pose laugh, হাঁটা বা চলাফেরা হলে pose walk (bg street বা park), দৌড় হলে run।
স্ক্রিপ্ট:
`+sb.map((x,i)=>i+'|'+x.t).join('\n');
  try{await navigator.clipboard.writeText(p);}
  catch(e){const t=document.createElement('textarea');t.value=p;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove();}
  st('প্রম্পট কপি হয়েছে ✔');
};

const sh=(h,a)=>{const n=parseInt(h.slice(1),16),f=v=>Math.max(0,Math.min(255,v+a));return`rgb(${f(n>>16)},${f((n>>8)&255)},${f(n&255)})`;};
const ease=x=>1-Math.pow(1-Math.min(1,Math.max(0,x)),3);
const lerp=(a,b,t)=>a+(b-a)*t;
const mod=(a,n)=>((a%n)+n)%n;
function grad(y0,y1,c0,c1){const g=cx.createLinearGradient(0,y0,0,y1);g.addColorStop(0,c0);g.addColorStop(1,c1);cx.fillStyle=g;cx.fillRect(0,y0,W,y1-y0);}
function rr(x,y,w,h,r){cx.beginPath();cx.moveTo(x+r,y);cx.arcTo(x+w,y,x+w,y+h,r);cx.arcTo(x+w,y+h,x,y+h,r);cx.arcTo(x,y+h,x,y,r);cx.arcTo(x,y,x+w,y,r);cx.closePath();}
function limb(x,y,l,a,w,col){cx.strokeStyle=col;cx.lineWidth=w;cx.lineCap='round';cx.beginPath();cx.moveTo(x,y);const ex=x+Math.sin(a)*l,ey=y+Math.cos(a)*l;cx.lineTo(ex,ey);cx.stroke();return[ex,ey];}
function heart(x,y,r,col){cx.fillStyle=col;cx.beginPath();cx.moveTo(x,y+r*.9);cx.bezierCurveTo(x-r*1.6,y-r*.1,x-r*.9,y-r*1.2,x,y-r*.45);cx.bezierCurveTo(x+r*.9,y-r*1.2,x+r*1.6,y-r*.1,x,y+r*.9);cx.fill();}

function inferPose(q,txt,n){
  let p=q.pose||'stand';
  const gen=(p==='stand'||p==='sit');
  if(n>1&&/জড়িয়ে|আলিঙ্গন|বুকে টেনে|জড়াজড়ি/.test(txt))return'hug';
  if(/চোখে জল|চোখের জল|কাঁদ|কান্না|অশ্রু/.test(txt))return'cry';
  if(n>1&&/মাথায় হাত|আদর/.test(txt))return'pat';
  if(gen&&/হাত নেড়ে|বিদায়/.test(txt))return'wave';
  if(gen&&/খাচ্ছ|খাই|খায়|খাবার|খাওয়া|খেল|খেয়ে|খেতে|ভাত|নাস্তা|রুটি|তরকারি/.test(txt))return'eat';
  if(gen&&/হাস|হেসে|মজা|খুশি/.test(txt))return'laugh';
  if(gen&&/হাঁটছ|হেঁটে|হাঁটতে|চলতে চলতে/.test(txt))return'walk';
  if(gen&&/দৌড়/.test(txt))return'run';
  if((p==='hug'||p==='pat')&&n<2)return'stand';
  return p;
}

const BG={home:['#f5e6d3','#b88b61'],kitchen:['#e3f2eb','#cbbba0'],market:['#fde8c8','#b0a090'],street:['#cfe3f5','#6d7078'],office:['#e4e8f2','#8a8f9c'],park:['#c9ecf7','#6fbf5a']};
function drawBG(b,gy,t,sc){
  const p=BG[b]||BG.home,u=Math.min(W,H)/720,out=(b==='street'||b==='park');
  grad(0,gy,sh(p[0],14),sh(p[0],-12));
  grad(gy,H,sh(p[1],10),sh(p[1],-32));
  if(out){
    for(let i=0;i<3;i++){

function pill(txt,a){
  const fs=Math.round(Math.min(W,H)*.042);
  cx.save();cx.globalAlpha=a;cx.font=`700 ${fs}px ${FONT}`;cx.textBaseline='middle';
  const w=cx.measureText(txt).width+fs*1.6,h=fs*1.8;
  cx.fillStyle='#e8590c';rr((W-w)/2,H*.04,w,h,h/2);cx.fill();
  cx.fillStyle='#fff';cx.textAlign='center';cx.fillText(txt,W/2,H*.04+h/2);cx.restore();
}

function caption(text,hl,alpha,prog){
  if(!text)return;
  const fs=Math.round(Math.min(W,H)*.055),mw=W*.86;
  cx.save();cx.font=`700 ${fs}px ${FONT}`;cx.textBaseline='middle';cx.textAlign='left';
  const wd=arr=>cx.measureText(arr.join(' ')).width,lines=[],ws=text.split(/\s+/);let cur=[];
  ws.forEach(w=>{if(cur.length&&wd(cur.concat(w))>mw){lines.push(cur);cur=[w];}else cur.push(w);});
  lines.push(cur);
  const lh=fs*1.35,bw=Math.max(...lines.map(wd))+fs*1.2,bh=lines.length*lh+fs*.7;
  const bx=(W-bw)/2,by=H-H*(W>H?.05:.08)-bh,now=Math.floor(Math.min(1,prog*1.08)*ws.length),hk=(hl||'').trim();
  cx.globalAlpha=alpha;cx.fillStyle='rgba(0,0,0,.68)';rr(bx,by,bw,bh,fs*.5);cx.fill();
  let gi=0;
  lines.forEach((ln,i)=>{
    let x=(W-wd(ln))/2;const y=by+fs*.35+lh*(i+.5);
    ln.forEach(w=>{cx.globalAlpha=alpha*(gi<=now?1:.55);cx.fillStyle=(hk&&w.includes(hk))?'#ffd43b':'#fff';cx.fillText(w,x,y);x+=cx.measureText(w+' ').width;gi++;});
  });
  cx.restore();
}

function frame(t){
  const por=H>W,gy=H*(por?.67:.75),u=Math.min(W,H)/720;
  let k=0;for(let i=0;i<subs.length;i++)if(subs[i].s<=t)k=i;
  const sb=subs[k]||{s:0,e:1,t:''},q=data.scenes.find(o=>+o.i===k)||{},pq=data.scenes.find(o=>+o.i===k-1)||{};
  const same=k>0&&pq.bg===q.bg&&String(pq.chars)===String(q.chars);
  const prog=Math.min(1,Math.max(0,(t-sb.s)/Math.max(.5,sb.e-sb.s))),age=Math.max(0,t-sb.s);
  const z=q.cam==='zoom'?1+.08*prog:1,txt=sb.t+(q.label||'');
  const ids=(q.chars&&q.chars.length?q.chars:[data.characters[0].id]).slice(0,2);
  const cs=ids.map(id=>data.characters.find(c=>c.id===id)||data.characters[0]),n=cs.length;
  const pose=inferPose(q,txt,n),pPose=k>0?inferPose(pq,(subs[k-1].t||'')+(pq.label||''),n):'';
  const s=por?W*.0024:H*.0019;
  const keep=same&&pose===pPose,en=same?1:ease(age/.5);
  const c1=pose==='hug'?(keep?1:ease(age/.8)):pose==='pat'?(keep?1:ease(age/.6)):0;
  const tx=pose==='hug'?[W*.5-29*s,W*.5+29*s]:[W*.5-56*s,W*.5+56*s];
  const xs=cs.map((c,i)=>(n===1?W*.5:lerp(i?W*.73:W*.27,tx[i],c1))+(1-en)*W*.12*(i?1:-1));
  const sc=pose==='walk'?t*190*u:pose==='run'?t*480*u:0;
  const qi=sb.t.search(/["“«]/);
  let spkOn=false;
  if(q.talk!==false){
    if(qi>=0)spkOn=prog>=(qi/sb.t.length)*.9&&t<=sb.e+.1;
    else if(q.speaker)spkOn=t>=sb.s&&t<=sb.e+.1;
  }
  const spk=q.speaker||(qi>=0?ids[0]:null);
  cx.clearRect(0,0,W,H);
  cx.save();cx.translate(W/2,H/2);cx.scale(z,z);cx.translate(-W/2,-H/2);
  drawBG(q.bg,gy,t,sc);
  cs.forEach((c,i)=>{
    cx.globalAlpha=Math.max(.01,en);
    if(pose==='sleep'){cx.fillStyle='#845ef7';rr(xs[i]-170*s,gy-30*s,340*s,34*s,10*s);cx.fill();cx.fillStyle='#fff';rr(xs[i]-170*s,gy-52*s,80*s,28*s,12*s);cx.fill();}
    cx.fillStyle='rgba(0,0,0,.2)';cx.beginPath();cx.ellipse(xs[i],gy+4*u,70*s*(c.g==='c'?.75:1),13*s,0,0,7);cx.fill();
    person(c,xs[i],gy,s,pose,t+i*.7,spkOn&&spk===c.id&&pose!=='eat',n>1&&i===1,n>1?1:0);
  });
  if(sc>0)cs.forEach((c,i)=>{const d=(n>1&&i===1)?1:-1;for(let j=0;j<4;j++){const f=(t*(pose==='run'?3:1.6)+j/4)%1;cx.globalAlpha=(1-f)*.5;cx.fillStyle='#e9e2d6';cx.beginPath();cx.arc(xs[i]+d*(40+f*90)*s,gy-(6+f*26)*s,(5+f*14)*s,0,7);cx.fill();}});
  cx.globalAlpha=1;
  if(pose==='hug'||pose==='pat')cs.forEach((c,i)=>person(c,xs[i],gy,s,pose,t,false,n>1&&i===1,1,'arms'));
  cx.globalAlpha=1;
  if(pose==='hug'&&c1>.7){
    for(let i=0;i<6;i++){
      const f=(t*.45+i/6)%1;
      cx.globalAlpha=Math.sin(f*Math.PI)*.9;
      heart(W*.5+Math.sin(i*2.3+t)*80*s,gy-290*s-f*200*s,(10+(i%3)*3)*s,'#ff6b81');
    }
    cx.globalAlpha=1;
  }
  if(/রাত/.test(txt)){cx.fillStyle='rgba(18,28,70,.38)';cx.fillRect(0,0,W,H);
    cx.fillStyle='#fff9db';for(let i=0;i<22;i++){cx.globalAlpha=.4+.6*Math.abs(Math.sin(t*1.5+i));cx.beginPath();cx.arc((i*173)%W,(i*89)%(gy*.5),(1.5+(i%3))*u,0,7);cx.fill();}
    cx.globalAlpha=1;cx.beginPath();cx.arc(W*.82,gy*.16,34*u,0,7);cx.fill();}
  else if(/সন্ধ্যা/.test(txt)){cx.fillStyle='rgba(255,130,50,.16)';cx.fillRect(0,0,W,H);}
  if(/বৃষ্টি/.test(txt)){
    cx.strokeStyle='rgba(60,90,140,.45)';cx.lineWidth=2*u;
    for(let i=0;i<70;i++){const x=(i*97*u+t*60)%W,y=(i*53*u+t*700*u)%H;cx.beginPath();cx.moveTo(x,y);cx.lineTo(x-5*u,y+22*u);cx.stroke();}
  }
  cx.restore();
  const vg=cx.createRadialGradient(W/2,H/2,Math.min(W,H)*.35,W/2,H/2,Math.max(W,H)*.75);
  vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,.28)');cx.fillStyle=vg;cx.fillRect(0,0,W,H);
  if(q.icon&&q.icon!=='none'){
    const ix=n===1?W*.82:W*.5;
    const iy=por?H*.15:H*.19;
    const ir=Math.min(W,H)*(por?.075:.085);
    icon(q.icon,ix,iy,ir,Math.min(1,age/.6),t);
  }
  if(q.label)pill(q.label,Math.min(1,age/.3));
  if(!same&&age<.25){cx.fillStyle=`rgba(0,0,0,${.75*(1-age/.25)})`;cx.fillRect(0,0,W,H);}
  caption(sb.t,q.hl,Math.min(1,age/.25),prog);
  if(DUR>0&&t>DUR-.5){cx.fillStyle=`rgba(0,0,0,${Math.min(1,(t-DUR+.5)/.5)})`;cx.fillRect(0,0,W,H);}
}

function showResult(blob){
  if(lastUrl)URL.revokeObjectURL(lastUrl);
  lastBlob=blob;lastUrl=URL.createObjectURL(blob);
  const ext=blob.type.includes('mp4')?'mp4':'webm',v=$('vid');
  v.onloadedmetadata=()=>{if(v.duration===Infinity){v.currentTime=1e7;v.ontimeupdate=()=>{v.ontimeupdate=null;v.currentTime=0;};}};
  v.src=lastUrl;v.load();
  $('dl').href=lastUrl;$('dl').download='animation-video.'+ext;
  $('info').textContent=ext.toUpperCase()+' • '+(blob.size/1048576).toFixed(1)+' MB';
  $('res').hidden=false;
  $('res').scrollIntoView({behavior:'smooth'});
}
$('sh').onclick=async()=>{
  if(!lastBlob)return;
  const ext=lastBlob.type.includes('mp4')?'mp4':'webm';
  try{
    const f=new File([lastBlob],'animation-video.'+ext,{type:lastBlob.type});
    if(navigator.canShare&&navigator.canShare({files:[f]}))await navigator.share({files:[f],title:'অ্যানিমেশন ভিডিও'});
    else st('এই ব্রাউজারে সরাসরি শেয়ার হয় না, ডাউনলোড করে শেয়ার করুন',1);
  }catch(e){if(e&&e.name!=='AbortError')st('শেয়ার করা গেল না: '+e.message,1);}
};

async function run(rec){
  if(busy)return;
  let ac=null;
  try{
    const af=$('aud').files[0];
    if(!af)throw Error('আগে অডিও ফাইল দিন');
    subs=parseSRT($('srt').value);
    if(!subs.length)throw Error('SRT ঠিকমতো পাওয়া যায়নি');
    data=$('js').value.trim()?parseJ($('js').value):{characters:[DEF],scenes:[]};
    if(rec&&!window.MediaRecorder)throw Error('এই ব্রাউজার ভিডিও রেকর্ড সাপোর্ট করে না, Chrome ব্যবহার করুন');
    setBusy(true);
    $('res').hidden=true;
    const AC=window.AudioContext||window.webkitAudioContext;
    ac=new AC();ac.resume();
    const qs=parseFloat($('qa').value)||1,base=$('fmt').value==='9:16'?[720,1280]:[1280,720];
    W=cv.width=Math.round(base[0]*qs);H=cv.height=Math.round(base[1]*qs);
    st('ফন্ট ও অডিও লোড হচ্ছে…');
    await Promise.race([document.fonts.load('700 40px "Hind Siliguri"','অআকখ৳').catch(()=>{}),new Promise(r=>setTimeout(r,3000))]);
    const buf=await ac.decodeAudioData(await af.arrayBuffer());
    const dur=Math.max(buf.duration,subs[subs.length-1].e)+.5;DUR=dur;
    const src=ac.createBufferSource();src.buffer=buf;
    let recd=null,done=null;const chunks=[];
    if(rec){
      const dest=ac.createMediaStreamDestination();src.connect(dest);
      const stream=new MediaStream([...cv.captureStream(30).getVideoTracks(),...dest.stream.getAudioTracks()]);
      const mime=['video/mp4;codecs=avc1,mp4a.40.2','video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'].find(m=>MediaRecorder.isTypeSupported(m))||'';
      const br=Math.round(5e6*qs*qs);
      recd=new MediaRecorder(stream,mime?{mimeType:mime,videoBitsPerSecond:br}:{videoBitsPerSecond:br});
      recd.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data);};
      done=new Promise(r=>{recd.onstop=r;});
      recd.start(1000);
      $('ov').hidden=false;
    }else src.connect(ac.destination);
    const t0=ac.currentTime+.2;
    src.start(t0);
    await new Promise(res=>{
      (function loop(){
        const t=ac.currentTime-t0;
        frame(Math.max(0,t));
        const p=Math.min(1,Math.max(0,t)/dur),pc=Math.round(p*100);
        $('bar').style.width=(p*100)+'%';
        $('ovp').textContent=pc+'%';
        st((rec?'ভিডিও তৈরি হচ্ছে… ':'প্রিভিউ চলছে… ')+pc+'%');
        if(t>=dur)return res();
        requestAnimationFrame(loop);
      })();
    });
    if(recd){
      await new Promise(r=>setTimeout(r,300));
      recd.stop();
      await done;
      if(!chunks.length)throw Error('ভিডিও ডেটা পাওয়া যায়নি, আবার চেষ্টা করুন');
      const type=(recd.mimeType||'video/webm').split(';')[0];
      showResult(new Blob(chunks,{type}));
      st('✅ ভিডিও তৈরি শেষ! নিচে দেখুন, শেয়ার বা ডাউনলোড করুন।');
    }else st('প্রিভিউ শেষ');
  }catch(e){
    st('ত্রুটি: '+e.message,1);
  }finally{
    $('ov').hidden=true;
    if(ac)ac.close().catch(()=>{});
    setBusy(false);
  }
}
$('go').onclick=()=>run(true);
$('pv').onclick=()=>run(false);

window.addEventListener('load',()=>{W=cv.width=720;H=cv.height=1280;frame(0);document.fonts.ready.then(()=>{if(!busy)frame(0);});});
</script>
